<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Numerology - Walhallaa</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <meta name="description" content="Discover your numerology numbers and their sacred meanings">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta property="og:title" content="Sacred Numerology Calculator">
    <meta property="og:description" content="Discover your Life Path, Destiny, Soul Urge & Personality Numbers through ancient mystical calculations ✧ ⚯ ☘ ⚶">
    <meta property="og:image" content="https://walhallaa.com/numerology/preview-image.jpg">
    <meta property="og:url" content="https://walhallaa.com/numerology">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Walhallaa">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sacred Numerology Calculator">
    <meta name="twitter:description" content="Discover your Life Path, Destiny, Soul Urge & Personality Numbers through ancient mystical calculations ✧ ⚯ ☘ ⚶">
    <meta name="twitter:image" content="https://walhallaa.com/numerology/preview-image.jpg">
    <meta name="twitter:domain" content="walhallaa.com">
</head>
<body class="numerology-page">
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <div class="content-wrapper">
        <main class="numerology-container">
            <h1 class="sacred-title">Sacred Numerology</h1>
            <p class="sacred-subtitle">Discover Your Divine Numbers</p>
            
            <div class="calculator-section">
                <div class="sacred-symbols">
                    <div class="symbol">☽</div>
                    <div class="symbol">☉</div>
                    <div class="symbol">⚡</div>
                </div>
                
                <div class="input-section">
                    <form id="numerologyForm">
                        <div class="form-group">
                            <label for="fullName">Your Sacred Name</label>
                            <input type="text" id="fullName" required placeholder="Enter your full birth name...">
                        </div>
                        <div class="form-group">
                            <label for="birthDate">Your Day of Emergence</label>
                            <div class="date-format">Format: MM/DD/YYYY (Month/Day/Year)</div>
                            <input type="date" 
                                   id="birthDate" 
                                   required 
                                   class="date-input">
                        </div>
                        <button type="submit" class="calculate-btn">Reveal Your Numbers</button>
                    </form>
                </div>

                <div id="results" class="results-section hidden">
                    <div class="result-card life-path">
                        <div class="card-symbol">✧</div>
                        <h3>Life Path Number</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                    
                    <div class="result-card destiny">
                        <div class="card-symbol">⚯</div>
                        <h3>Destiny Number</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                    
                    <div class="result-card soul-urge">
                        <div class="card-symbol">☘</div>
                        <h3>Soul Urge Number</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                    
                    <div class="result-card personality">
                        <div class="card-symbol">⚶</div>
                        <h3>Personality Number</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="./translations.js"></script>
    <script src="./numerology.js"></script>
    <script src="./matrix.js"></script>
    <script src="./cursor.js"></script>
</body>
</html>
