<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutsal Numeroloji - Walhallaa</title>
    <link rel="stylesheet" type="text/css" href="/numerology/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <meta name="description" content="Numeroloji sayılarınızı ve kutsal anlamlarını keşfedin">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body class="numerology-page">
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <div class="content-wrapper">
        <main class="numerology-container">
            <h1 class="sacred-title">Kutsal Numeroloji</h1>
            <p class="sacred-subtitle">İlahi Sayılarını Keşfet</p>
            
            <div class="calculator-section">
                <div class="sacred-symbols">
                    <div class="symbol">☽</div>
                    <div class="symbol">☉</div>
                    <div class="symbol">⚡</div>
                </div>
                
                <div class="input-section">
                    <form id="numerologyForm">
                        <div class="form-group">
                            <label for="fullName">Kutsal İsminiz</label>
                            <input type="text" id="fullName" required placeholder="Doğum isminizi girin...">
                        </div>
                        <div class="form-group">
                            <label for="birthDate">Dünyaya Geliş Gününüz</label>
                            <div class="date-format">Format: MM/DD/YYYY (Ay/Gün/Yıl)</div>
                            <input type="date" 
                                   id="birthDate" 
                                   required 
                                   class="date-input">
                        </div>
                        <button type="submit" class="calculate-btn">Sayılarınızı Keşfedin</button>
                    </form>
                </div>

                <div id="results" class="results-section hidden">
                    <div class="result-card life-path">
                        <div class="card-symbol">✧</div>
                        <h3>Yaşam Yolu Sayısı</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                    
                    <div class="result-card destiny">
                        <div class="card-symbol">⚯</div>
                        <h3>Kader Sayısı</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                    
                    <div class="result-card soul-urge">
                        <div class="card-symbol">☘</div>
                        <h3>Ruh Sayısı</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                    
                    <div class="result-card personality">
                        <div class="card-symbol">⚶</div>
                        <h3>Kişilik Sayısı</h3>
                        <div class="number"></div>
                        <div class="meaning"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/numerology/translations.js"></script>
    <script src="/numerology/numerology.js"></script>
    <script src="/numerology/matrix.js"></script>
    <script src="/numerology/cursor.js"></script>
</body>
</html>
