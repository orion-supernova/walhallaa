<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found — Murat Can Koç</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F05138">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F6F4; --ink: #111111; --orange: #F05138;
    --display: "Bricolage Grotesque", -apple-system, "SF Pro Display", system-ui, sans-serif;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: 1fr auto;
    background: var(--orange); color: var(--ink); font: 400 17px/1.6 var(--serif); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--ink); color: var(--orange); }
  main { position: relative; overflow: hidden; display: grid; align-content: center; padding: 64px 24px; max-width: 1280px; width: 100%; margin: 0 auto; }
  main::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(55% 60% at 75% 20%, rgba(255, 255, 255, .3), transparent 62%); }
  .in { position: relative; z-index: 1; }
  .eyebrow { margin: 0 0 20px; font: 500 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(17, 17, 17, .72); }
  h1 { margin: 0 0 8px; font-family: var(--display); font-optical-sizing: auto; font-weight: 800;
    font-size: clamp(4.5rem, 20vw, 13rem); line-height: .84; letter-spacing: -.055em; }
  h1 .w { color: var(--paper); display: block; }
  p.lede { margin: 26px 0 34px; font-size: clamp(1.1rem, 1.6vw, 1.35rem); max-width: 46ch; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 9px; font: 600 15px/1 var(--display); text-decoration: none;
    padding: 15px 24px; border-radius: 999px; border: 2px solid var(--ink); color: var(--ink);
    transition: transform .35s var(--ease), background .25s, color .25s; }
  .btn:hover { transform: translateY(-2px); }
  .btn-ink { background: var(--ink); color: var(--orange); }
  .btn-ink:hover { background: #000; }
  .btn-line:hover { background: var(--ink); color: var(--orange); }
  footer { background: var(--paper); border-top: 3px solid var(--ink); }
  .foot-in { max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    font: 500 12.5px/1 var(--mono); letter-spacing: .04em; color: #8C8C8C; }
  .foot-in a { color: var(--ink); text-decoration: none; margin-left: auto; }
  .foot-in a:hover { color: var(--orange); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="in">
    <p class="eyebrow">Murat Can Koç · iOS &amp; macOS developer</p>
    <h1>404<span class="w">not here.</span></h1>
    <p class="lede">This address doesn't lead anywhere. The apps, the source and the legal documents are all one page away.</p>
    <div class="row">
      <a class="btn btn-ink" href="/">See the work</a>
      <a class="btn btn-line" href="mailto:info@walhallaa.com">Email me</a>
    </div>
  </div>
</main>
<footer>
  <div class="foot-in">
    <span>© 2026 A.M.M.C.K. Productions</span>
    <a href="/">walhallaa.com</a>
  </div>
</footer>
</body>
</html>
